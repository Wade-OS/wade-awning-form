<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Wade RV — Awning & Slide Topper Measurement Form</title>
<style>
  :root {
    --ink: #1c2530;
    --ink-soft: #5c6b7a;
    --ink-faint: #94a3b1;
    --paper: #fbfaf7;
    --panel: #ffffff;
    --line: #e2e0da;
    --line-strong: #c9c6bd;
    --accent: #b5541e;
    --accent-soft: #fdf0e6;
    --accent-line: #e2a679;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 20px 20px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header .brand { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: var(--accent); margin-bottom: 2px; }
  header h1 { font-size: 19px; margin: 0; font-weight: 700; }
  header p { margin: 4px 0 0; font-size: 13px; color: var(--ink-soft); }

  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 60px; }

  /* Wider screens: everyday desktop monitor (designed around 1920x1080), not a phone stretched
     out. Cap the reading width so it doesn't sprawl edge to edge, and let the review step and
     job-details step go two columns since those are the two tall, scroll-heavy screens. */
  @media (min-width: 760px) {
    main { max-width: 1080px; padding: 32px 24px 80px; }
    .review-layout { display: grid; grid-template-columns: minmax(480px, 1.3fr) 1fr; gap: 32px; align-items: start; }
    .review-layout .diagram-col { position: sticky; top: 20px; }
    .job-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  }

  .step-count { font-size: 12px; color: var(--ink-faint); margin-bottom: 6px; }
  h2 { font-size: 17px; margin: 0 0 12px; font-weight: 700; }
  h3 { font-size: 14px; margin: 0 0 8px; font-weight: 600; color: var(--ink); }
  p.hint { font-size: 13px; color: var(--ink-soft); margin: 0 0 14px; line-height: 1.5; }

  .pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .pill {
    padding: 12px 18px; border-radius: 999px; border: 1.5px solid var(--line-strong);
    background: var(--panel); color: var(--ink); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: 0.15s; -webkit-tap-highlight-color: transparent;
  }
  .pill:active { transform: scale(0.97); }
  .pill.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

  .swatch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .swatch-card { border: 2px solid var(--line-strong); border-radius: 10px; background: var(--panel); padding: 6px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .swatch-card.active { border-color: var(--accent); }
  .swatch-img { width: 100%; aspect-ratio: 1; border-radius: 6px; background-size: cover; background-position: center; }
  .swatch-img-empty { display: flex; align-items: center; justify-content: center; background: var(--paper); border: 1px dashed var(--line-strong); color: var(--ink-faint); font-size: 11px; text-align: center; padding: 8px; }
  .swatch-name { font-size: 12px; font-weight: 600; text-align: center; margin-top: 6px; color: var(--ink); }
  .swatch-card.active .swatch-name { color: var(--accent); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; transition: background 0.3s, border-color 0.3s; }

  label.field-label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; margin-top: 14px; }
  label.field-label:first-child { margin-top: 0; }
  input[type=text], input[type=email], input[type=number], select {
    width: 100%; padding: 12px 12px; border-radius: 10px; border: 1.5px solid var(--line-strong);
    font-size: 15px; font-family: inherit; color: var(--ink); background: var(--panel);
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .dim-row { display: flex; gap: 8px; align-items: center; }
  .dim-row input { width: 100px; }
  .dim-unit { font-size: 13px; color: var(--ink-soft); }

  .nav-row { display: flex; justify-content: space-between; margin-top: 24px; }
  button.nav-btn {
    padding: 13px 22px; border-radius: 10px; border: none; font-size: 15px; font-weight: 700;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button.nav-btn.primary { background: var(--accent); color: #fff; }
  button.nav-btn.primary:disabled { background: #d8d4cb; color: #9a9689; cursor: not-allowed; }
  button.nav-btn.secondary { background: transparent; color: var(--ink-soft); }

  svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  .final-summary { font-size: 13px; }
  .final-summary .row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .final-summary .row span:first-child { color: var(--ink-soft); }
  .final-summary .row span:last-child { font-weight: 600; text-align: right; max-width: 60%; }

  .done-screen { text-align: center; padding: 40px 16px; }
  .done-screen .check { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 28px; }
</style>
</head>
<body>

<header>
  <div class="brand">WADE RV — UPHOLSTERY & ACCESSORIES</div>
  <h1>Awning &amp; Slide Topper Measurement Form</h1>
  <p>Answer each question and we'll build the diagram as you go.</p>
</header>

<main id="app"></main>

<script>
// 🔴 NEW: catches ANY error anywhere in this page's JavaScript and shows it directly on screen
// as plain text, instead of failing silently with a blank page. This is what let us actually
// see what's going wrong on a device/browser we can't get console access to.
window.onerror = function(message, source, lineno, colno, error) {
  const app = document.getElementById('app');
  if (app) {
    app.innerHTML = `<div style="background:#fdecea; border:1px solid #f3c2bd; border-radius:10px; padding:16px; font-family:monospace; font-size:13px; white-space:pre-wrap; word-break:break-word;">
      <strong>Something went wrong loading this page.</strong><br><br>
      ${message}<br>
      Line ${lineno}, column ${colno}<br><br>
      ${error && error.stack ? error.stack : '(no stack trace available)'}
    </div>`;
  }
  return true; // prevents the browser's own default error handling from also firing
};

function getSteps() {
  let s = ['side', 'type', 'material', 'color'];
  if (state.type === 'Awning') s = s.concat(['style', 'dims', 'diagram']);
  else if (state.type === 'Topper') s = s.concat(['dims', 'topperReview']);
  s = s.concat(['jobInfo', 'finalReview', 'done']);
  return s;
}

function h(html) { document.getElementById('app').innerHTML = html; syncSelects(); }
function syncSelects() {
  document.querySelectorAll('select[data-key]').forEach(sel => {
    sel.value = state[sel.getAttribute('data-key')] || '';
  });
}
function pill(label, active, onclick) {
  return `<button type="button" class="pill${active ? ' active' : ''}" onclick="${onclick}">${label}</button>`;
}
// 🔴 NEW: "Black" needs a different swatch depending on material (vinyl vs acrylic look
// different), so try the material-specific key first, then the plain name, then no image at
// all for colors we don't have a scan of yet (Charcoal tweed, Special request).
// 🔴 FIX: was a case-sensitive lookup, so "Linen tweed" (the actual color option, lowercase
// tweed) never matched the image map's "Linen Tweed" key — same issue for Heather beige/Beige.
// Rather than just fix those two strings, this makes the whole lookup case-insensitive so a
// future capitalization mismatch can't cause the same silent "no photo" result again.
function swatchImageFor(colorName) {
  const wanted1 = `${colorName} (${state.material})`.toLowerCase();
  const wanted2 = colorName.toLowerCase();
  for (const key in SWATCH_IMAGES) {
    const k = key.toLowerCase();
    if (k === wanted1) return SWATCH_IMAGES[key];
  }
  for (const key in SWATCH_IMAGES) {
    if (key.toLowerCase() === wanted2) return SWATCH_IMAGES[key];
  }
  return null;
}
function swatchCard(colorName) {
  const active = state.color === colorName;
  const img = swatchImageFor(colorName);
  const imgHtml = img
    ? `<div class="swatch-img" style="background-image:url('${img}');"></div>`
    : `<div class="swatch-img swatch-img-empty">No sample photo yet</div>`;
  return `<button type="button" class="swatch-card${active ? ' active' : ''}" onclick="setField('color','${colorName}')">
    ${imgHtml}
    <div class="swatch-name">${colorName}</div>
  </button>`;
}
function cordSelect(id, val) {
  return `<select data-key="${id}" onchange="setField('${id}', this.value)"><option value="">Select cord size</option>${CORD_SIZES.map(c => `<option value="${c}">${c}</option>`).join('')}</select>`;
}
function cordText(count, c1, c2, isGirrard) {
  if (isGirrard) return c1 ? c1 : 'not set';
  if (!count) return 'not set';
  if (count === 1) return c1 || 'not set';
  if (!c1 && !c2) return '2 cords, sizes not set';
  if (c1 && c2 && c1 === c2) return `2 cords, both ${c1}`;
  return `2 cords: ${c1 || '?'} + ${c2 || '?'}`;
}
function dimStr(ft, inches) {
  if (!ft && !inches) return '';
  return `${ft || 0}'${inches || 0}"`;
}
function materialColorText() {
  if (!state.material && !state.color) return 'Fabric';
  return [state.material, state.color].filter(Boolean).join(' — ');
}
function zigzag(x1, y1, x2, y2, amp) {
  const n = 6; let pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const x = x1 + (x2 - x1) * t + (i % 2 === 0 ? -amp : amp) * (i > 0 && i < n ? 1 : 0);
    const y = y1 + (y2 - y1) * t;
    pts.push(`${x},${y}`);
  }
  return pts.join(' ');
}

function awningDiagramSvg() {
  const s = state;
  const isGirrard = s.style === 'Girrard';
  const mirror = s.side === 'Passenger';
  const leftLabel = mirror ? 'Back of coach' : 'Front of coach';
  const rightLabel = mirror ? 'Front of coach' : 'Back of coach';
  const width = dimStr(s.widthFt, s.widthIn), length = dimStr(s.lengthFt, s.lengthIn);
  const railText = cordText(s.railCount, s.railCord1, s.railCord2, isGirrard);
  const tubeText = cordText(s.tubeCount, s.tubeCord1, s.tubeCord2, isGirrard);
  const ledOnLeft = s.led && ((mirror && s.ledEdge === 'Back') || (!mirror && s.ledEdge === 'Front'));
  const ledOnRight = s.led && ((mirror && s.ledEdge === 'Front') || (!mirror && s.ledEdge === 'Back'));
  const railFill = s.activeZone === 'rail' ? '#fdf0e6' : '#fbfaf7';
  const tubeFill = s.activeZone === 'tube' ? '#fdf0e6' : '#fbfaf7';
  const flapFill = s.activeZone === 'flap' ? '#fdf0e6' : '#fbfaf7';

  const rx1 = 70, rx2 = 310;
  const railH = 26;
  const railTop = 42, ry = railTop + railH;
  const tx1 = rx1 + SX, tx2 = rx2 + SX, ty = ry + SY;
  const tr = 13;

  const flapTop = ty + tr, flapH = 32;
  let flapPath, flapLabelY;
  if (isGirrard) { flapPath = ''; flapLabelY = 0; }
  else if (s.flapEdge === 'Scalloped') {
    const span = tx2 - tx1, n = 4, bw = span / n, amp = 16;
    let d = `M${tx1},${flapTop} L${tx2},${flapTop} L${tx2},${flapTop+flapH-amp}`;
    for (let i = n - 1; i >= 0; i--) d += ` Q${tx1 + bw*i + bw/2},${flapTop+flapH} ${tx1 + bw*i},${flapTop+flapH-amp}`;
    d += ' Z';
    flapPath = `<path d="${d}" fill="${flapFill}" stroke="#c9c6bd" stroke-width="0.5" onclick="jumpTo('flap')" style="cursor:pointer;"/>`;
    flapLabelY = flapTop + 10;
  } else {
    flapPath = `<polygon points="${tx1},${flapTop} ${tx2},${flapTop} ${tx2},${flapTop+flapH} ${tx1},${flapTop+flapH}" fill="${flapFill}" stroke="#c9c6bd" stroke-width="0.5" onclick="jumpTo('flap')" style="cursor:pointer;"/>`;
    flapLabelY = flapTop + flapH/2;
  }
  const flapLabel = isGirrard ? '' : `<text x="${(tx1+tx2)/2}" y="${flapLabelY}" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="600" fill="#5c6b7a">Awning flap — ${s.flapEdge || 'style not set'} edge</text>`;

  const tubeGroup = `
    <g onclick="jumpTo('tube')" style="cursor:pointer;">
      <rect x="${tx1}" y="${ty-tr}" width="${tx2-tx1}" height="${tr*2}" fill="${tubeFill}" stroke="#c9c6bd" stroke-width="0.5"/>
      <ellipse cx="${tx1}" cy="${ty}" rx="4" ry="${tr}" fill="${tubeFill}" stroke="#c9c6bd" stroke-width="0.5"/>
      <ellipse cx="${tx2}" cy="${ty}" rx="4" ry="${tr}" fill="#f1efe9" stroke="#c9c6bd" stroke-width="0.5"/>
    </g>
    <text x="${(tx1+tx2)/2}" y="${ty-6}" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#5c6b7a">Roll tube</text>
    <text x="${(tx1+tx2)/2}" y="${ty+6}" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#5c6b7a">Cord: ${tubeText}</text>
  `;

  const wireLeftPts = zigzag(rx1+9, ry+4, tx1+9, ty-4, 6);
  const wireRightPts = zigzag(rx2-9, ry+4, tx2-9, ty-4, 6);

  const calloutY = flapTop + flapH + 26;
  function ledCallout(pts, labelSide) {
    const coords = pts.split(' ').map(p => p.split(',').map(Number));
    const wireMidX = coords[3][0], wireMidY = coords[3][1];
    const labelText = `LED wire runs here (${labelSide === 'left' ? leftLabel : rightLabel})`;
    const boxW = Math.round(labelText.length * 5.4 + 18);
    const boxCx = Math.max(30 + boxW/2, Math.min(350 - boxW/2, wireMidX));
    return `
      <polyline points="${pts}" fill="none" stroke="#b5541e" stroke-width="3" stroke-linecap="round"/>
      <polyline points="${pts}" fill="none" stroke="#fbfaf7" stroke-width="1" stroke-dasharray="1,3"/>
      <line x1="${wireMidX}" y1="${wireMidY}" x2="${boxCx}" y2="${calloutY-9}" stroke="#b5541e" stroke-width="1" stroke-dasharray="2,2"/>
      <rect x="${boxCx-boxW/2}" y="${calloutY-9}" width="${boxW}" height="18" rx="4" fill="#fdf0e6" stroke="#e2a679" stroke-width="0.75"/>
      <text x="${boxCx}" y="${calloutY}" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="700" fill="#b5541e">${labelText}</text>
    `;
  }

  return `<svg width="100%" viewBox="0 0 380 ${calloutY+20}" role="img"><title>Awning diagram</title><desc>Rail attaching to coach, fabric extending to a cylindrical roll tube, flap, LED wire callout</desc>
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
    <text x="190" y="12" text-anchor="middle" font-size="10" fill="#b5541e">Width${width ? ': ' + width : ''}</text>
    <line x1="${rx1}" y1="18" x2="${rx2}" y2="18" stroke="#b5541e" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="190" y="32" text-anchor="middle" font-size="9" fill="#94a3b1">${s.side || 'side not set'} side</text>
    <polygon points="${rx1},${ry} ${rx2},${ry} ${tx2},${ty} ${tx1},${ty}" fill="#f1efe9" stroke="#e2e0da" stroke-width="0.5"/>
    <text x="${(rx1+rx2+tx1+tx2)/4}" y="${(ry+ty)/2}" text-anchor="middle" font-size="11" fill="#1c2530">${materialColorText()}</text>
    <rect x="${rx1}" y="${railTop}" width="${rx2-rx1}" height="${railH}" fill="${railFill}" stroke="#c9c6bd" stroke-width="0.5" onclick="jumpTo('rail')" style="cursor:pointer;"/>
    <text x="190" y="${railTop+10}" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#5c6b7a">Awning rail — attaches to coach</text>
    <text x="190" y="${railTop+20}" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#5c6b7a">Cord: ${railText}</text>
    <polygon points="${rx1},${ry} ${rx1+18},${ry} ${tx1+18},${ty} ${tx1},${ty}" fill="transparent" onclick="jumpTo('led')" style="cursor:pointer;"/>
    <text x="${(rx1+tx1)/2-6}" y="${(ry+ty)/2}" text-anchor="middle" font-size="8" fill="#5c6b7a" transform="rotate(-80 ${(rx1+tx1)/2-6} ${(ry+ty)/2})">${leftLabel}</text>
    <polygon points="${rx2-18},${ry} ${rx2},${ry} ${tx2},${ty} ${tx2-18},${ty}" fill="transparent" onclick="jumpTo('led')" style="cursor:pointer;"/>
    <text x="${(rx2+tx2)/2+6}" y="${(ry+ty)/2}" text-anchor="middle" font-size="8" fill="#5c6b7a" transform="rotate(-80 ${(rx2+tx2)/2+6} ${(ry+ty)/2})">${rightLabel}</text>
    <line x1="${rx2+30}" y1="${ry}" x2="${tx2+30}" y2="${ty}" stroke="#b5541e" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="${rx2+54}" y="${(ry+ty)/2}" text-anchor="middle" font-size="10" fill="#b5541e" transform="rotate(85 ${rx2+54} ${(ry+ty)/2})">Length${length ? ': ' + length : ''}</text>
    ${isGirrard ? '' : flapPath}
    ${tubeGroup}
    ${isGirrard ? `<text x="190" y="${ty+40}" text-anchor="middle" font-size="10" fill="#94a3b1">Girrard/box style — no flap</text>` : flapLabel}
    ${ledOnLeft ? ledCallout(wireLeftPts, 'left') : ''}
    ${ledOnRight ? ledCallout(wireRightPts, 'right') : ''}
  </svg>`;
}

function topperDiagramSvg() {
  const s = state;
  const width = dimStr(s.widthFt, s.widthIn), length = dimStr(s.lengthFt, s.lengthIn);
  return `<svg width="100%" viewBox="0 0 380 210" role="img"><title>Slide topper diagram</title><desc>Coach-side edge on top, slide-side edge on bottom</desc>
    <defs><marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
    <line x1="60" y1="14" x2="320" y2="14" stroke="#b5541e" stroke-width="1" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
    <text x="190" y="10" text-anchor="middle" font-size="10" fill="#b5541e">Width${width ? ': ' + width : ''}</text>
    <rect x="60" y="24" width="260" height="18" fill="#fbfaf7" stroke="#c9c6bd" stroke-width="0.5"/>
    <text x="190" y="33" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5c6b7a">Coach-side edge — cord: ${s.topperCoachCord || 'not set'}</text>
    <rect x="60" y="42" width="260" height="110" fill="#f1efe9" stroke="#e2e0da" stroke-width="0.5"/>
    <text x="190" y="97" text-anchor="middle" font-size="12" fill="#1c2530">${materialColorText()}</text>
    <line x1="336" y1="42" x2="336" y2="152" stroke="#b5541e" stroke-width="1" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
    <text x="358" y="97" text-anchor="middle" font-size="10" fill="#b5541e" transform="rotate(90 358 97)">Length${length ? ': ' + length : ''}</text>
    <rect x="60" y="152" width="260" height="18" fill="#fbfaf7" stroke="#c9c6bd" stroke-width="0.5"/>
    <text x="190" y="161" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5c6b7a">Slide-side edge — cord: ${s.topperSlideCord || 'not set'}</text>
    <text x="190" y="188" text-anchor="middle" font-size="9" fill="#94a3b1">Slide-side attaches to the slide room and extends outward</text>
  </svg>`;
}

function cordQuestion(id, label, countKey, cord1Key, cord2Key) {
  const s = state;
  const isGirrard = s.style === 'Girrard';
  let body = `<h3>${label}</h3>`;
  if (isGirrard) {
    body += `<p class="hint">Girrard/box style always has exactly 1 cord here.</p>${cordSelect(cord1Key, s[cord1Key])}`;
  } else {
    body += `<div class="pill-row">${pill('1 cord', s[countKey] === 1, `setCount('${countKey}', 1)`)}${pill('2 cords', s[countKey] === 2, `setCount('${countKey}', 2)`)}</div>`;
    if (s[countKey]) body += `<div style="margin-top:8px;">${cordSelect(cord1Key, s[cord1Key])}</div>`;
    if (s[countKey] === 2) body += `<div style="margin-top:8px;">${cordSelect(cord2Key, s[cord2Key])}</div>`;
  }
  return `<div id="q-${id}" class="card">${body}</div>`;
}
function ledQuestion() {
  const s = state;
  let body = `<h3>LEDs</h3><div class="pill-row">${pill('LEDs: yes', s.led === true, 'setLed(true)')}${pill('LEDs: no', s.led === false, 'setLed(false)')}</div>`;
  if (s.led) body += `<label class="field-label">Which end does the wiring hem sew into?</label><div class="pill-row">${pill('Front of coach', s.ledEdge === 'Front', "setLedEdge('Front')")}${pill('Back of coach', s.ledEdge === 'Back', "setLedEdge('Back')")}</div>`;
  return `<div id="q-led" class="card">${body}</div>`;
}
function flapQuestion() {
  const s = state;
  if (s.style === 'Girrard') return `<div id="q-flap" class="card"><h3>Flap</h3><p class="hint" style="margin:0;">Girrard/box style has no flap.</p></div>`;
  return `<div id="q-flap" class="card"><h3>Flap over the tube</h3><div class="pill-row">${pill('Squared edge', s.flapEdge === 'Squared', "setFlapEdge('Squared')")}${pill('Scalloped edge', s.flapEdge === 'Scalloped', "setFlapEdge('Scalloped')")}</div></div>`;
}

// 🔴 NEW: relocated here from the material step — this isn't for color matching, it's for the
// tech to show something specific or unusual about the actual construction (damage, an odd
// mounting detail, anything a photo explains faster than words), so it belongs alongside the
// rest of the construction details rather than earlier in the flow. The notes field is the same
// idea in text form, for anything a photo can't capture.
function photoAndNotesCard() {
  const s = state;
  return `<div class="card">
    <h3>Photo (optional)</h3>
    <p class="hint" style="margin-bottom:10px;">If there's something specific about this awning/topper worth showing us — unusual construction, damage, anything a picture explains faster than words.</p>
    <input type="file" accept="image/*" capture="environment" onchange="handlePhotoUpload(this)">
    <div id="photoPreview" style="margin-top:10px;">${s.photoData ? `<img src="${s.photoData}" style="max-width:200px; border-radius:8px; display:block;"><p class="hint" style="margin-top:6px;">${s.photoName}</p>` : ''}</div>
    <label class="field-label" style="margin-top:16px;">Special instructions or comments (optional)</label>
    <textarea rows="3" oninput="setFieldSilent('notes', this.value)" placeholder="Anything we should know about this specific job" style="width:100%; padding:12px; border-radius:10px; border:1.5px solid var(--line-strong); font-size:15px; font-family:inherit; color:var(--ink); resize:vertical;">${s.notes}</textarea>
  </div>`;
}

function canAdvance() {
  const s = state;
  if (s.step === 'side') return !!s.side;
  if (s.step === 'type') return !!s.type;
  if (s.step === 'material') return !!s.material;
  if (s.step === 'color') return !!s.color;
  if (s.step === 'style') return !!s.style;
  if (s.step === 'dims') return s.widthFt !== '' && s.lengthFt !== '';
  if (s.step === 'jobInfo') return !!s.techName && !!s.workOrder;
  return true;
}

function renderInner() {
  const s = state, steps = getSteps();
  const stepIdx = steps.indexOf(s.step);
  let body = s.step === 'done' ? '' : `<div class="step-count">Step ${stepIdx+1} of ${steps.length - 1}</div>`;

  if (s.step === 'side') {
    body += `<h2>Which side of the coach?</h2><div class="pill-row">${pill('Driver side', s.side === 'Driver', "setField('side','Driver')")}${pill('Passenger side', s.side === 'Passenger', "setField('side','Passenger')")}</div>`;
  } else if (s.step === 'type') {
    body += `<h2>What do you need?</h2><div class="pill-row">${pill('Slide topper', s.type === 'Topper', "setField('type','Topper')")}${pill('Awning', s.type === 'Awning', "setField('type','Awning')")}</div>`;
  } else if (s.step === 'material') {
    body += `<h2>Material</h2><div class="pill-row">${pill('Vinyl', s.material === 'Vinyl', "setMaterial('Vinyl')")}${pill('Acrylic', s.material === 'Acrylic', "setMaterial('Acrylic')")}</div>`;
    body += `<p class="hint">Acrylic is the canvas-style material typically used on higher-end RVs. Vinyl is the standard material — straightforward, and works well for most jobs.</p>`;
  } else if (s.step === 'color') {
    const opts = s.type === 'Awning' && s.material === 'Vinyl' ? ['Black'] : COLORS[s.material];
    body += `<h2>Color</h2>`;
    body += `<div class="swatch-grid">${opts.map(c => swatchCard(c)).join('')}</div>`;
    if (s.type === 'Awning' && s.material === 'Vinyl') body += `<p class="hint">Vinyl awnings are only made in black.</p>`;
  } else if (s.step === 'style') {
    body += `<h2>Style</h2><div class="pill-row">${pill('Girrard box', s.style === 'Girrard', "setField('style','Girrard')")}${pill('Standard (Carefree/Lippert/Dometic)', s.style === 'Standard', "setField('style','Standard')")}</div>`;
    if (s.style === 'Girrard') body += `<p class="hint">Girrard: vertical seams only, no flap, always 1 cord at the rail and 1 at the tube.</p>`;
  } else if (s.step === 'dims') {
    body += `<h2>Width</h2>
      <div class="dim-row">
        <input type="number" min="0" step="1" value="${s.widthFt}" oninput="setFieldSilent('widthFt', this.value)" placeholder="Feet"><span class="dim-unit">ft</span>
        <input type="number" min="0" step="0.125" value="${s.widthIn}" oninput="setFieldSilent('widthIn', this.value)" placeholder="Inches"><span class="dim-unit">in</span>
      </div>
      <h2 style="margin-top:20px;">Length / projection</h2>
      <div class="dim-row">
        <input type="number" min="0" step="1" value="${s.lengthFt}" oninput="setFieldSilent('lengthFt', this.value)" placeholder="Feet"><span class="dim-unit">ft</span>
        <input type="number" min="0" step="0.125" value="${s.lengthIn}" oninput="setFieldSilent('lengthIn', this.value)" placeholder="Inches"><span class="dim-unit">in</span>
      </div>
      <p class="hint">Inches can be fractional (e.g. 6.5 or 6.125 for 6 1/8").</p>`;
  } else if (s.step === 'diagram') {
    body += `<h2>Review</h2><p class="hint">${materialColorText()}. Every question is listed below — tap the diagram to jump to a specific one.</p>`;
    body += `<div class="review-layout">`;
    body += `<div class="diagram-col">${awningDiagramSvg()}</div>`;
    body += `<div class="questions-col">`;
    body += cordQuestion('rail', 'Awning rail cord', 'railCount', 'railCord1', 'railCord2');
    body += cordQuestion('tube', 'Roll tube cord', 'tubeCount', 'tubeCord1', 'tubeCord2');
    body += ledQuestion();
    body += flapQuestion();
    body += photoAndNotesCard();
    body += `</div></div>`;
  } else if (s.step === 'topperReview') {
    body += `<h2>Review</h2><p class="hint">${materialColorText()}. Toppers just need a cord size on each edge — no flap, no style question.</p>`;
    body += `<div class="review-layout">`;
    body += `<div class="diagram-col">${topperDiagramSvg()}</div>`;
    body += `<div class="questions-col">`;
    body += `<div class="card"><h3>Coach-side edge cord size</h3>${cordSelect('topperCoachCord', s.topperCoachCord)}</div>`;
    body += `<div class="card"><h3>Slide-side edge cord size</h3>${cordSelect('topperSlideCord', s.topperSlideCord)}</div>`;
    body += photoAndNotesCard();
    body += `</div></div>`;
  } else if (s.step === 'jobInfo') {
    function field(labelText, key, val, placeholder, type) {
      return `<div class="field-group">
        <input type="${type || 'text'}" value="${val}" oninput="setFieldSilent('${key}', this.value)" placeholder="${placeholder}">
        <label class="field-label" style="margin-top:6px;">${labelText}</label>
      </div>`;
    }
    body += `<h2>Job details</h2><p class="hint">Last step — just needs to say who this is for.</p>
      <div class="card">
        <div class="job-grid">
          ${field('Your name (tech filling this out)', 'techName', s.techName, 'e.g. John Smith')}
          ${field('Your email (in case we have questions)', 'techEmail', s.techEmail, 'you@dealer.com', 'email')}
          ${field('Service advisor name', 'advisorName', s.advisorName, 'e.g. Jane Doe')}
          ${field('Service advisor email', 'advisorEmail', s.advisorEmail, 'advisor@dealer.com', 'email')}
          ${field('PO / RO / work order number', 'workOrder', s.workOrder, 'e.g. WO-38213')}
          ${field('Dealership', 'dealership', s.dealership, 'e.g. General RV')}
          ${field('Coach year', 'coachYear', s.coachYear, 'e.g. 2025')}
          ${field('Coach make', 'coachMake', s.coachMake, 'e.g. Forest River')}
          ${field('Coach model', 'coachModel', s.coachModel, 'e.g. Georgetown')}
        </div>
      </div>`;
  } else if (s.step === 'finalReview') {
    body += `<h2>Review before submitting</h2><p class="hint">One more look at everything, including the diagram — go back and fix anything that's not right before you submit.</p>`;
    body += `<div class="review-layout">`;
    body += `<div class="diagram-col">${s.type === 'Awning' ? awningDiagramSvg() : topperDiagramSvg()}</div>`;
    body += `<div class="questions-col">${summaryRows()}</div>`;
    body += `</div>`;
    if (s.submitError) body += `<p class="hint" style="color:#b3261e;">${s.submitError}</p>`;
  } else if (s.step === 'done') {
    body += doneScreen();
  }

  if (s.step === 'finalReview') {
    body += `<div class="nav-row">
      <button type="button" class="nav-btn secondary" onclick="back()">Back</button>
      <button type="button" class="nav-btn primary" onclick="submitForm()" ${s.submitting ? 'disabled' : ''}>${s.submitting ? 'Submitting…' : 'Submit'}</button>
    </div>`;
  } else if (s.step !== 'done') {
    body += `<div class="nav-row">
      <button type="button" class="nav-btn secondary" onclick="back()" style="visibility:${s.step === 'side' ? 'hidden' : 'visible'};">Back</button>
      <button type="button" class="nav-btn primary" id="nextBtn" onclick="next()" ${canAdvance() ? '' : 'disabled'}>${s.step === 'jobInfo' ? 'Review' : 'Next'}</button>
    </div>`;
  }
  h(body);
}

// 🔴 NEW: wraps renderInner() so a failure shows exactly which step it happened on, directly
// on screen — same idea as the window.onerror handler above, just with more specific context
// since this is where most of the page's actual work happens.
function render() {
  try {
    renderInner();
  } catch (err) {
    const app = document.getElementById('app');
    if (app) {
      app.innerHTML = `<div style="background:#fdecea; border:1px solid #f3c2bd; border-radius:10px; padding:16px; font-family:monospace; font-size:13px; white-space:pre-wrap; word-break:break-word;">
        <strong>Something went wrong on the "${state.step}" step.</strong><br><br>
        ${err.message}<br><br>
        ${err.stack || '(no stack trace available)'}
      </div>`;
    }
  }
}

function summaryRows() {
  const s = state;
  const isGirrard = s.style === 'Girrard';
  const rows = [
    ['Tech', s.techName], ['Tech email', s.techEmail], ['Service advisor', s.advisorName], ['Advisor email', s.advisorEmail],
    ['Work order', s.workOrder], ['Dealership', s.dealership],
    ['Coach', [s.coachYear, s.coachMake, s.coachModel].filter(Boolean).join(' ')],
    ['Side of coach', s.side], ['Item', s.type], ['Material', s.material], ['Color', s.color],
    ['Width', dimStr(s.widthFt, s.widthIn)], ['Length', dimStr(s.lengthFt, s.lengthIn)]
  ];
  if (s.type === 'Awning') {
    rows.push(['Style', s.style]);
    rows.push(['Rail cord', cordText(s.railCount, s.railCord1, s.railCord2, isGirrard)]);
    rows.push(['Tube cord', cordText(s.tubeCount, s.tubeCord1, s.tubeCord2, isGirrard)]);
    rows.push(['LEDs', s.led ? `Yes, ${s.ledEdge} of coach` : 'No']);
    rows.push(['Flap', isGirrard ? 'None (Girrard)' : (s.flapEdge || 'not set')]);
  } else {
    rows.push(['Coach-side cord', s.topperCoachCord || 'not set']);
    rows.push(['Slide-side cord', s.topperSlideCord || 'not set']);
  }
  rows.push(['Notes', s.notes || '']);
  let html = `<div class="final-summary">${rows.map(r => `<div class="row"><span>${r[0]}</span><span>${r[1] || '—'}</span></div>`).join('')}</div>`;
  if (s.photoData) html += `<div style="margin-top:14px;"><p class="hint" style="margin-bottom:6px;">Photo of existing awning/topper:</p><img src="${s.photoData}" style="max-width:100%; border-radius:8px;"></div>`;
  return html;
}

function doneScreen() {
  const s = state;
  return `<div class="done-screen">
    <div class="check">✓</div>
    <h2 style="margin-bottom:6px;">Submitted</h2>
    <p class="hint">Work order ${s.workOrder || '—'} is in. We'll reach out to ${s.techEmail || 'you'} if we have any questions.</p>
    <button type="button" class="nav-btn primary" style="margin-top:24px;" onclick="location.reload()">Start a new one</button>
  </div>`;
}

function setField(k, v) { state[k] = v; render(); }

// 🔴 NEW: compress on the way in — a phone photo straight off the camera can be several MB,
// which is both slow to send and pushes against the size limits on what a web app can hand off
// to the backend in one call. Downscaling to a reasonable max dimension keeps it fast without
// losing the detail that actually matters for matching fabric.
function handlePhotoUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1200;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        const scale = MAX / Math.max(w, h);
        w = Math.round(w * scale); h = Math.round(h * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      state.photoData = canvas.toDataURL('image/jpeg', 0.82);
      state.photoName = file.name;
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function setMaterial(v) { state.material = v; state.color = null; render(); }
function setFieldSilent(k, v) {
  state[k] = v;
  const btn = document.getElementById('nextBtn');
  if (btn) btn.disabled = !canAdvance();
}
function setCount(k, n) { state[k] = n; render(); }
function setLedEdge(v) { state.ledEdge = v; render(); }
function setFlapEdge(v) { state.flapEdge = v; render(); }
function setLed(v) { state.led = v; if (!v) state.ledEdge = null; render(); }
function jumpTo(id) {
  render();
  const el = document.getElementById('q-' + id);
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.style.background = '#fdf0e6'; setTimeout(() => { el.style.background = '#fff'; }, 1200); }
}
function next() { if (!canAdvance()) return; const steps = getSteps(); const i = steps.indexOf(state.step); if (i < steps.length - 1) { state.step = steps[i+1]; window.scrollTo(0,0); render(); } }

// 🔴 NEW: the real submit — sends everything to the backend, which saves it to a sheet and
// (optionally) a Drive photo. Only advances to the "done" screen once the backend actually
// confirms success; shows the real error message and lets the tech retry if it fails.
// 🔴 NEW: Turns the same SVG diagram shown on screen into an actual PNG image, so it can be
// sent with the submission instead of just the raw underlying numbers. Draws it onto a white
// background first — SVGs are transparent by default, which would otherwise render as a black
// square in most email clients.
function captureDiagramAsPng() {
  return new Promise((resolve) => {
    try {
      const svgString = state.type === 'Awning' ? awningDiagramSvg() : topperDiagramSvg();
      const viewBoxMatch = svgString.match(/viewBox="0 0 (\d+) (\d+)"/);
      const vw = viewBoxMatch ? parseInt(viewBoxMatch[1]) : 380;
      const vh = viewBoxMatch ? parseInt(viewBoxMatch[2]) : 320;
      const scale = 2; // render at 2x for a crisp image in the email, not a blurry one

      const svgDataUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = vw * scale; canvas.height = vh * scale;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = () => resolve(null); // don't block submission over a diagram-capture hiccup
      img.src = svgDataUrl;
    } catch (e) {
      resolve(null);
    }
  });
}

// 🔴 The one real difference from the Apps-Script-hosted version: since this page lives on
// GitHub Pages now, google.script.run doesn't exist here at all — that bridge only works when
// Apps Script itself serves the page. This calls the same backend function instead via a plain
// fetch() POST. Content-Type is deliberately "text/plain" rather than "application/json" — that
// specific choice avoids the browser sending a CORS preflight request first, which Apps Script
// doesn't handle, and would otherwise make every submission fail silently.
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbxgTovhaPRshKzXbydSEl_Jb8TogQs7UmsAHYW1FENJlEsDfLdScTT43Rm4E2ag35BV/exec';

async function submitForm() {
  state.submitting = true; state.submitError = ''; render();
  state.diagramImage = await captureDiagramAsPng();
  try {
    const res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(state)
    });
    const result = await res.json();
    if (!result.success) throw new Error(result.error || 'Unknown error');
    state.submitting = false;
    state.submitted = true;
    state.step = 'done';
    window.scrollTo(0, 0);
    render();
  } catch (err) {
    state.submitting = false;
    state.submitError = 'Something went wrong submitting this: ' + err.message + '. Nothing was lost — tap Submit to try again.';
    render();
  }
}
function back() { const steps = getSteps(); const i = steps.indexOf(state.step); if (i > 0) { state.step = steps[i-1]; window.scrollTo(0,0); render(); } }

render();
</script>
</body>
</html>
